<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-label="The Genesis judge: a candidate climbs four worlds in order, streams, harder streams, reward-free Snake and reward-free Crafter, passing a gate at each step; its score multiplies elegance, robustness to parameter changes and a weighted sum of prediction, adaptation, memory, structure and cost." font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="979" height="429" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <text x="40" y="38" font-size="11" fill="#656d76" letter-spacing="1">THE LADDER · EVALUATED IN ORDER, STOPS AT THE FIRST FAILED GATE</text>

  <!-- ladder -->
  <rect x="40" y="60" width="120" height="70" rx="8" fill="#f6f8fa" stroke="#1f2328"/>
  <text x="100" y="91" text-anchor="middle" font-weight="600">Candidate</text>
  <text x="100" y="110" text-anchor="middle" font-size="11" fill="#656d76">principle.py</text>

  <g>
    <rect x="200" y="60" width="160" height="70" rx="8" fill="#ffffff" stroke="#1f2328"/>
    <text x="280" y="84" text-anchor="middle" font-size="11" fill="#656d76">LEVEL 1</text>
    <text x="280" y="104" text-anchor="middle" font-weight="600">Sensory streams</text>
    <text x="280" y="121" text-anchor="middle" font-size="11" fill="#656d76">regimes change &amp; return</text>

    <rect x="400" y="60" width="160" height="70" rx="8" fill="#ffffff" stroke="#1f2328"/>
    <text x="480" y="84" text-anchor="middle" font-size="11" fill="#656d76">LEVEL 2</text>
    <text x="480" y="104" text-anchor="middle" font-weight="600">Harder streams</text>
    <text x="480" y="121" text-anchor="middle" font-size="11" fill="#656d76">32 channels, XOR, delays</text>

    <rect x="600" y="60" width="160" height="70" rx="8" fill="#ffffff" stroke="#1f2328"/>
    <text x="680" y="84" text-anchor="middle" font-size="11" fill="#656d76">LEVEL 3</text>
    <text x="680" y="104" text-anchor="middle" font-weight="600">Snake</text>
    <text x="680" y="121" text-anchor="middle" font-size="11" fill="#656d76">no reward · first actions</text>

    <rect x="800" y="60" width="140" height="70" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/>
    <text x="870" y="84" text-anchor="middle" font-size="11" fill="#0550ae">LEVEL 4</text>
    <text x="870" y="104" text-anchor="middle" font-weight="600" fill="#0550ae">Crafter</text>
    <text x="870" y="121" text-anchor="middle" font-size="11" fill="#0550ae">no reward · target &gt; 2.1%</text>
  </g>
  <g stroke="#1f2328" stroke-width="1.2">
    <line x1="160" y1="95" x2="198" y2="95" marker-end="url(#a)"/>
    <line x1="360" y1="95" x2="398" y2="95" marker-end="url(#a)"/>
    <line x1="560" y1="95" x2="598" y2="95" marker-end="url(#a)"/>
    <line x1="760" y1="95" x2="798" y2="95" marker-end="url(#a)"/>
  </g>
  <g font-size="11" fill="#656d76" text-anchor="middle">
    <text x="380" y="150">gate</text><text x="580" y="150">gate</text><text x="780" y="150">gate</text>
  </g>
  <text x="580" y="170" text-anchor="middle" font-size="12">gate = score ≥ 1.25 × best baseline · robustness R ≥ 0.7 · end of run beats its start</text>

  <!-- score components -->
  <text x="40" y="212" font-size="11" fill="#656d76" letter-spacing="1">THE SCORE</text>
  <g>
    <rect x="40" y="226" width="280" height="84" rx="8" fill="#ffffff" stroke="#1f2328"/>
    <text x="58" y="252" font-weight="600">Elegance  E</text>
    <text x="58" y="273" font-size="12" fill="#656d76">penalty for every constant and branch</text>
    <text x="58" y="291" font-size="12" fill="#656d76">hidden outside PARAMS</text>

    <rect x="350" y="226" width="280" height="84" rx="8" fill="#ffffff" stroke="#1f2328"/>
    <text x="368" y="252" font-weight="600">Robustness  R</text>
    <text x="368" y="273" font-size="12" fill="#656d76">each PARAMS value × random [0.5, 2],</text>
    <text x="368" y="291" font-size="12" fill="#656d76">4 reruns: do the phenomena survive?</text>

    <rect x="660" y="226" width="280" height="84" rx="8" fill="#ffffff" stroke="#1f2328"/>
    <text x="678" y="252" font-weight="600">Behaviour</text>
    <text x="678" y="273" font-size="12" fill="#656d76">prediction · adaptation · memory on</text>
    <text x="678" y="291" font-size="12" fill="#656d76">return · structure tracks world · cost</text>
  </g>
  <text x="490" y="342" text-anchor="middle" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">score = 100 · E · R · (0.35 P + 0.20 A + 0.15 M + 0.20 S + 0.10 C)</text>

  <!-- in progress -->
  <rect x="40" y="366" width="900" height="44" rx="8" fill="#ffffff" stroke="#656d76" stroke-dasharray="5 4"/>
  <text x="490" y="393" text-anchor="middle" font-size="12" fill="#656d76">in progress: grokking probe (held-out rule combinations) · long GPU track for late bloomers · scaling 8 → 64 channels</text>
</svg>
